# Jamii Savings: host nginx on the VPS. Copy to /etc/nginx/sites-available/jamii.conf and symlink
# into sites-enabled. One Let's Encrypt certificate covers all four names (see docs/VPS-DEPLOYMENT.md).
# Every container port is bound to 127.0.0.1, so nginx is the only way in.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# HTTP -> HTTPS
server {
    listen 80;
    server_name api.jamii.daqiqtech.co.ke portal.jamii.daqiqtech.co.ke jenkins.jamii.daqiqtech.co.ke mi.jamii.daqiqtech.co.ke;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# API gateway (public; OAuth2 or API key enforced by API Manager)
server {
    listen 443 ssl http2;
    server_name api.jamii.daqiqtech.co.ke;
    include /etc/nginx/snippets/jamii-tls.conf;
    location / {
        proxy_pass https://127.0.0.1:8243;
        include /etc/nginx/snippets/jamii-proxy.conf;
        proxy_read_timeout 30s;               # MI's longest backend timeout is 10 s
    }
}

# Developer Portal (public) + Publisher / Admin / Carbon (allowlisted), all on API Manager 9443
server {
    listen 443 ssl http2;
    server_name portal.jamii.daqiqtech.co.ke;
    include /etc/nginx/snippets/jamii-tls.conf;
    location = / { return 302 /devportal; }
    location ~ ^/(publisher|admin|carbon|api/am/publisher|api/am/admin) {
        include /etc/nginx/snippets/jamii-allowlist.conf;
        proxy_pass https://127.0.0.1:9443;
        include /etc/nginx/snippets/jamii-proxy.conf;
    }
    location / {
        proxy_pass https://127.0.0.1:9443;
        include /etc/nginx/snippets/jamii-proxy.conf;
    }
}

# Jenkins (allowlisted; /github-webhook/ is opened to GitHub when the push trigger is enabled)
server {
    listen 443 ssl http2;
    server_name jenkins.jamii.daqiqtech.co.ke;
    include /etc/nginx/snippets/jamii-tls.conf;
    location / {
        include /etc/nginx/snippets/jamii-allowlist.conf;
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/snippets/jamii-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# MI management API (allowlisted)
server {
    listen 443 ssl http2;
    server_name mi.jamii.daqiqtech.co.ke;
    include /etc/nginx/snippets/jamii-tls.conf;
    location / {
        include /etc/nginx/snippets/jamii-allowlist.conf;
        proxy_pass https://127.0.0.1:9164;
        include /etc/nginx/snippets/jamii-proxy.conf;
    }
}
