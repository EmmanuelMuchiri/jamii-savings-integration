openapi: 3.0.3
info:
  title: Jamii Customer Profile
  version: v1
  description: 'Returns a customer profile from the Jamii customer system. Managed proxy through WSO2 Micro Integrator: correlation ID, header
    hygiene, timeout and fault handling.'
  contact:
    name: Jamii Savings API team
servers:
- url: https://localhost:8243/jamii/customers/v1
  description: Local gateway (dev)
- url: https://api.jamii.daqiqtech.co.ke/jamii/customers/v1
  description: Production gateway (proposed)
tags:
- name: jamii
security:
- ApiKeyAuth: []
paths:
  /{customerId}:
    get:
      tags:
      - jamii
      operationId: getCustomer
      summary: Get a customer profile
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{1,10}$
        example: '1001'
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
        description: Optional. Reused end to end if supplied; generated by the gateway if not.
      responses:
        '200':
          description: Customer found
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                customerId: '1001'
                fullName: Wanjiru Kamau
                nationalId: '28456123'
                phone: '+254712345678'
                email: wanjiru.kamau@example.co.ke
                kycStatus: VERIFIED
                branch: Nairobi CBD
        '400':
          description: Customer ID is not numeric
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: The request is invalid.
                  httpStatus: 400
                  details:
                  - field: customerId
                    issue: must be numeric (1 to 10 digits)
                requestId: 5b1f8c2e-6a0d-4f7e-9b3a-2c1d0e9f8a77
                timestamp: '2026-10-09T09:15:30.120Z'
        '401':
          description: Missing or invalid credentials (returned by the API Manager gateway)
        '404':
          description: No such customer
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: CUSTOMER_NOT_FOUND
                  message: No customer exists for the supplied customer ID.
                  httpStatus: 404
                  details: []
                requestId: 5b1f8c2e-6a0d-4f7e-9b3a-2c1d0e9f8a77
                timestamp: '2026-10-09T09:15:30.120Z'
        '429':
          description: Subscription quota exceeded (returned by the API Manager gateway)
        '502':
          description: Customer system returned an error
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_GATEWAY
                  message: The customer service returned an invalid response.
                  httpStatus: 502
                  details: []
                requestId: 5b1f8c2e-6a0d-4f7e-9b3a-2c1d0e9f8a77
                timestamp: '2026-10-09T09:15:30.120Z'
        '503':
          description: Customer system unreachable
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BACKEND_UNAVAILABLE
                  message: The backend service is temporarily unavailable.
                  httpStatus: 503
                  details: []
                requestId: 5b1f8c2e-6a0d-4f7e-9b3a-2c1d0e9f8a77
                timestamp: '2026-10-09T09:15:30.120Z'
        '504':
          description: Customer system did not answer within 5 s
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BACKEND_TIMEOUT
                  message: The backend service did not respond in time.
                  httpStatus: 504
                  details: []
                requestId: 5b1f8c2e-6a0d-4f7e-9b3a-2c1d0e9f8a77
                timestamp: '2026-10-09T09:15:30.120Z'
components:
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      - requestId
      - timestamp
      additionalProperties: false
      description: Standard error body returned by every Jamii API, whatever the backend (BRD 8.3).
      properties:
        error:
          type: object
          required:
          - code
          - message
          - httpStatus
          - details
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
              - VALIDATION_ERROR
              - UNAUTHORIZED
              - ACCOUNT_NOT_FOUND
              - CUSTOMER_NOT_FOUND
              - ELIGIBILITY_REJECTED
              - THROTTLED
              - INTERNAL_ERROR
              - BAD_GATEWAY
              - DB_UNAVAILABLE
              - BACKEND_UNAVAILABLE
              - BACKEND_TIMEOUT
            message:
              type: string
            httpStatus:
              type: integer
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
        requestId:
          type: string
          description: Correlation ID (also in the X-Correlation-ID header)
        timestamp:
          type: string
          format: date-time
    ErrorDetail:
      type: object
      required:
      - field
      - issue
      properties:
        field:
          type: string
        issue:
          type: string
    Customer:
      type: object
      required:
      - customerId
      properties:
        customerId:
          type: string
        fullName:
          type: string
        nationalId:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        kycStatus:
          type: string
          enum:
          - VERIFIED
          - PENDING
          - REJECTED
        branch:
          type: string
  headers:
    CorrelationId:
      schema:
        type: string
      description: Correlation ID for tracing
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: ApiKey
