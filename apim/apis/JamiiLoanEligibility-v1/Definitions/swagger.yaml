openapi: 3.0.3
info:
  title: Jamii Loan Eligibility
  version: v1
  description: Checks whether a customer can afford a requested loan. REST/JSON in front of the Jamii credit-check engine (SOAP 1.1 CheckEligibility),
    mediated by WSO2 Micro Integrator.
  contact:
    name: Jamii Savings API team
servers:
- url: https://localhost:8243/jamii/loans/v1
  description: Local gateway (dev)
- url: https://api.jamii.daqiqtech.co.ke/jamii/loans/v1
  description: Production gateway (proposed)
tags:
- name: jamii
security:
- default: []
paths:
  /eligibility:
    post:
      tags:
      - jamii
      operationId: checkEligibility
      summary: Check loan eligibility
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
        description: Optional. Reused end to end if supplied; generated by the gateway if not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EligibilityRequest'
            example:
              customerId: '1001'
              monthlyIncome: 120000
              existingMonthlyDebt: 15000
              requestedMonthlyInstalment: 25000
      responses:
        '200':
          description: Decision made
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityResponse'
              example:
                customerId: '1001'
                decision: ELIGIBLE
                eligible: true
                debtToIncomePercent: 33
                maxAllowedPercent: 40
                creditReference: CRD-7F3A9C21
                requestId: 5b1f8c2e-6a0d-4f7e-9b3a-2c1d0e9f8a77
                timestamp: '2026-10-09T09:15:30.120Z'
        '400':
          description: Missing or invalid fields, or malformed JSON
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: The request is invalid.
                  httpStatus: 400
                  details:
                  - field: monthlyIncome
                    issue: is required
                requestId: 5b1f8c2e-6a0d-4f7e-9b3a-2c1d0e9f8a77
                timestamp: '2026-10-09T09:15:30.120Z'
        '401':
          description: Missing or invalid credentials (returned by the API Manager gateway)
        '422':
          description: Rejected by the credit engine (SOAP client fault)
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ELIGIBILITY_REJECTED
                  message: Monthly income must be greater than zero.
                  httpStatus: 422
                  details: []
                requestId: 5b1f8c2e-6a0d-4f7e-9b3a-2c1d0e9f8a77
                timestamp: '2026-10-09T09:15:30.120Z'
        '429':
          description: Subscription quota exceeded (returned by the API Manager gateway)
        '502':
          description: Credit engine error (SOAP server fault)
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_GATEWAY
                  message: The credit service returned an error.
                  httpStatus: 502
                  details: []
                requestId: 5b1f8c2e-6a0d-4f7e-9b3a-2c1d0e9f8a77
                timestamp: '2026-10-09T09:15:30.120Z'
        '503':
          description: Credit engine unreachable
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BACKEND_UNAVAILABLE
                  message: The backend service is temporarily unavailable.
                  httpStatus: 503
                  details: []
                requestId: 5b1f8c2e-6a0d-4f7e-9b3a-2c1d0e9f8a77
                timestamp: '2026-10-09T09:15:30.120Z'
        '504':
          description: Credit engine did not answer within 10 s
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BACKEND_TIMEOUT
                  message: The backend service did not respond in time.
                  httpStatus: 504
                  details: []
                requestId: 5b1f8c2e-6a0d-4f7e-9b3a-2c1d0e9f8a77
                timestamp: '2026-10-09T09:15:30.120Z'
components:
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      - requestId
      - timestamp
      additionalProperties: false
      description: Standard error body returned by every Jamii API, whatever the backend (BRD 8.3).
      properties:
        error:
          type: object
          required:
          - code
          - message
          - httpStatus
          - details
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
              - VALIDATION_ERROR
              - UNAUTHORIZED
              - ACCOUNT_NOT_FOUND
              - CUSTOMER_NOT_FOUND
              - ELIGIBILITY_REJECTED
              - THROTTLED
              - INTERNAL_ERROR
              - BAD_GATEWAY
              - DB_UNAVAILABLE
              - BACKEND_UNAVAILABLE
              - BACKEND_TIMEOUT
            message:
              type: string
            httpStatus:
              type: integer
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
        requestId:
          type: string
          description: Correlation ID (also in the X-Correlation-ID header)
        timestamp:
          type: string
          format: date-time
    ErrorDetail:
      type: object
      required:
      - field
      - issue
      properties:
        field:
          type: string
        issue:
          type: string
    EligibilityRequest:
      type: object
      required:
      - customerId
      - monthlyIncome
      - existingMonthlyDebt
      - requestedMonthlyInstalment
      properties:
        customerId:
          type: string
        monthlyIncome:
          type: number
          minimum: 0
        existingMonthlyDebt:
          type: number
          minimum: 0
        requestedMonthlyInstalment:
          type: number
          minimum: 0
    EligibilityResponse:
      type: object
      required:
      - customerId
      - decision
      - eligible
      - debtToIncomePercent
      - maxAllowedPercent
      - creditReference
      - requestId
      - timestamp
      properties:
        customerId:
          type: string
        decision:
          type: string
          enum:
          - ELIGIBLE
          - NOT_ELIGIBLE
        eligible:
          type: boolean
        debtToIncomePercent:
          type: integer
        maxAllowedPercent:
          type: integer
        creditReference:
          type: string
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
  headers:
    CorrelationId:
      schema:
        type: string
      description: Correlation ID for tracing
  securitySchemes:
    default:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://localhost:9443/oauth2/token
          scopes: {}
