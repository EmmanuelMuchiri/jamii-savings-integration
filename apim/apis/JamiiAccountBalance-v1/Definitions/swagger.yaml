openapi: 3.0.3
info:
  title: Jamii Account Balance
  version: v1
  description: Returns the balance and status of a Jamii Savings account. Backed by a database through WSO2 Micro Integrator.
  contact:
    name: Jamii Savings API team
servers:
- url: https://localhost:8243/jamii/accounts/v1
  description: Local gateway (dev)
- url: https://api.jamii.daqiqtech.co.ke/jamii/accounts/v1
  description: Production gateway (proposed)
tags:
- name: jamii
security:
- default: []
paths:
  /{accountNumber}/balance:
    get:
      tags:
      - jamii
      operationId: getAccountBalance
      summary: Get an account balance
      parameters:
      - name: accountNumber
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{10,16}$
        example: 0123456789
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
        description: Optional. Reused end to end if supplied; generated by the gateway if not.
      responses:
        '200':
          description: Account found
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
              example:
                accountNumber: 0123456789
                status: ACTIVE
                balance:
                  amount: 15250.75
                  currency: KES
                requestId: 5b1f8c2e-6a0d-4f7e-9b3a-2c1d0e9f8a77
                timestamp: '2026-10-09T09:15:30.120Z'
        '400':
          description: Account number is not 10 to 16 digits
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: The request is invalid.
                  httpStatus: 400
                  details:
                  - field: accountNumber
                    issue: must be 10 to 16 digits
                requestId: 5b1f8c2e-6a0d-4f7e-9b3a-2c1d0e9f8a77
                timestamp: '2026-10-09T09:15:30.120Z'
        '401':
          description: Missing or invalid credentials (returned by the API Manager gateway)
        '404':
          description: No such account
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ACCOUNT_NOT_FOUND
                  message: No account exists for the supplied account number.
                  httpStatus: 404
                  details: []
                requestId: 5b1f8c2e-6a0d-4f7e-9b3a-2c1d0e9f8a77
                timestamp: '2026-10-09T09:15:30.120Z'
        '429':
          description: Subscription quota exceeded (returned by the API Manager gateway)
        '503':
          description: Database unavailable
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: DB_UNAVAILABLE
                  message: The account service is temporarily unavailable.
                  httpStatus: 503
                  details: []
                requestId: 5b1f8c2e-6a0d-4f7e-9b3a-2c1d0e9f8a77
                timestamp: '2026-10-09T09:15:30.120Z'
        '504':
          description: Database did not answer in time
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BACKEND_TIMEOUT
                  message: The backend service did not respond in time.
                  httpStatus: 504
                  details: []
                requestId: 5b1f8c2e-6a0d-4f7e-9b3a-2c1d0e9f8a77
                timestamp: '2026-10-09T09:15:30.120Z'
components:
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      - requestId
      - timestamp
      additionalProperties: false
      description: Standard error body returned by every Jamii API, whatever the backend (BRD 8.3).
      properties:
        error:
          type: object
          required:
          - code
          - message
          - httpStatus
          - details
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
              - VALIDATION_ERROR
              - UNAUTHORIZED
              - ACCOUNT_NOT_FOUND
              - CUSTOMER_NOT_FOUND
              - ELIGIBILITY_REJECTED
              - THROTTLED
              - INTERNAL_ERROR
              - BAD_GATEWAY
              - DB_UNAVAILABLE
              - BACKEND_UNAVAILABLE
              - BACKEND_TIMEOUT
            message:
              type: string
            httpStatus:
              type: integer
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
        requestId:
          type: string
          description: Correlation ID (also in the X-Correlation-ID header)
        timestamp:
          type: string
          format: date-time
    ErrorDetail:
      type: object
      required:
      - field
      - issue
      properties:
        field:
          type: string
        issue:
          type: string
    BalanceResponse:
      type: object
      required:
      - accountNumber
      - status
      - balance
      - requestId
      - timestamp
      properties:
        accountNumber:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - DORMANT
          - CLOSED
        balance:
          type: object
          required:
          - amount
          - currency
          properties:
            amount:
              type: number
              format: double
            currency:
              type: string
              enum:
              - KES
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
  headers:
    CorrelationId:
      schema:
        type: string
      description: Correlation ID for tracing
  securitySchemes:
    default:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://localhost:9443/oauth2/token
          scopes: {}
