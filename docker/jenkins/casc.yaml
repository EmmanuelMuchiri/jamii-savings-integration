# Jenkins configuration as code: no setup wizard, everything below exists on first start.
jenkins:
  systemMessage: "Jamii Savings Integration Platform CI"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "apim-admin-password"
              description: "API Manager admin password"
              secret: "${APIM_ADMIN_PASSWORD}"
          - string:
              scope: GLOBAL
              id: "h2-password"
              description: "H2 application user password"
              secret: "${H2_PASSWORD}"
jobs:
  - script: >
      pipelineJob('jamii-savings-integration') {
        description('Build, test and deploy all three Jamii APIs (MI + APIM) in one pipeline')
        parameters {
          booleanParam('PROMOTE_TO_PROD', false, 'Run the approval-gated prod stage (dry run)')
          booleanParam('FORCE_FAIL_IMPORT', false, 'Demo: break one API import to prove there is no partial deploy and rollback runs')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url(System.getenv('JAMII_REPO_URL') ?: 'file:///src') }
                branch(System.getenv('JAMII_REPO_BRANCH') ?: '*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
