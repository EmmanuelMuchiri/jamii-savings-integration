# /etc/nginx/snippets/jamii-tls.conf
ssl_certificate     /etc/letsencrypt/live/api.jamii.daqiqtech.co.ke/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/api.jamii.daqiqtech.co.ke/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
add_header Strict-Transport-Security "max-age=31536000" always;
