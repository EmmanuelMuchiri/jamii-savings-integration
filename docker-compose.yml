# Jamii Savings integration stack.
# Profiles: core (APIs), observability (ELK, stretch), ci (Jenkins + registry).
#   docker compose --profile core up -d
#   docker compose --profile core --profile observability up -d
# Dockerfiles are added per Jira stories S2.4-S2.10 (core) and E8/E9 (stretch).
# The mock backends (mock-backends/) are part of this stack; they can also be
# deployed on their own with mock-backends/docker-compose.yml.

name: jamii

x-build-common: &build-common
  additional_contexts:
    dist: ./dist          # WSO2 zips, verified against dist/checksums.txt

networks:
  jamii-net:

volumes:
  h2-data:
  mi-logs:
  apim-logs:
  es-data:
  jenkins-home:
  registry-data:

services:
  # ---------- core ----------
  mock-backends:
    profiles: [core]
    build: { context: ./mock-backends }
    image: ${REGISTRY}/jamii/mock-backends:${TAG}
    ports: ["127.0.0.1:8081:8080"]           # Swagger UI and direct testing from the host
    networks:
      jamii-net:
        aliases: [jamii-mock-backends]        # the name MI's backend URLs use

  h2:
    profiles: [core]
    build:
      context: ./docker/h2
      additional_contexts:
        db: ./db
    image: ${REGISTRY}/jamii/h2:${TAG}
    environment:
      H2_DB_NAME: ${H2_DB_NAME}
      H2_USER: ${H2_USER}
      H2_PASSWORD: ${H2_PASSWORD}
      H2_RESET_ON_START: ${H2_RESET_ON_START:-true}
    volumes: [h2-data:/data]
    ports: ["127.0.0.1:8082:8082"]          # H2 console, dev only; 9092 stays internal
    networks: [jamii-net]

  mi:
    profiles: [core]
    build:
      context: ./docker/mi
      additional_contexts:
        dist: ./dist        # WSO2 zip, verified against dist/checksums.txt
        mi_src: ./mi        # integration artifacts
      args:
        MI_VERSION: ${MI_VERSION}
        JAVA_BASE_IMAGE: ${WSO2_JAVA_BASE_IMAGE}
    image: ${REGISTRY}/jamii/mi:${TAG}
    environment:
      H2_URL: jdbc:h2:tcp://h2:9092/${H2_DB_NAME}
      H2_USER: ${H2_USER}
      H2_PASSWORD: ${H2_PASSWORD}
      CUSTOMER_BACKEND_URL: ${CUSTOMER_BACKEND_URL}
      CREDIT_BACKEND_URL: ${CREDIT_BACKEND_URL}
    volumes: [mi-logs:/home/wso2/mi/repository/logs]
    ports: ["127.0.0.1:9164:9164"]          # management API only; runtime 8290 is never published
    depends_on:
      h2:
        condition: service_healthy
      mock-backends:
        condition: service_healthy
    networks: [jamii-net]

  apim:
    profiles: [core]
    build:
      context: ./docker/apim
      additional_contexts:
        dist: ./dist        # WSO2 zip, verified against dist/checksums.txt
      args:
        APIM_VERSION: ${APIM_VERSION}
        JAVA_BASE_IMAGE: ${WSO2_JAVA_BASE_IMAGE}
    image: ${REGISTRY}/jamii/apim:${TAG}
    environment:
      APIM_ADMIN_USER: ${APIM_ADMIN_USER}
      APIM_ADMIN_PASSWORD: ${APIM_ADMIN_PASSWORD}
    volumes: [apim-logs:/home/wso2/apim/repository/logs]
    ports:
      - "9443:9443"   # Publisher, Developer Portal, Admin
      - "8243:8243"   # Gateway (HTTPS)
    depends_on:
      mi:
        condition: service_healthy
    networks: [jamii-net]

  # One-shot: publishes the tier, APIs, API Product and demo app once API Manager is healthy,
  # then runs the gateway checks. Re-runs are safe (everything is idempotent).
  apim-init:
    profiles: [core]
    build:
      context: ./docker/apim-init
      additional_contexts:
        dist: ./dist        # optional apictl-<ver>-linux-<arch>.tar.gz for offline builds
    image: ${REGISTRY}/jamii/apim-init:${TAG}
    environment:
      APIM_URL: https://apim:9443             # inside the Docker network
      GATEWAY_URL: https://apim:8243
      PUBLIC_APIM_URL: https://localhost:9443  # written to .apim-demo.env for use from the host
      PUBLIC_GATEWAY_URL: https://localhost:8243
      RUN_GATEWAY_CHECK: ${RUN_GATEWAY_CHECK:-true}
    volumes:
      - ./:/work                               # repo: apim/ projects, scripts, .env; writes .apim-demo.env
    depends_on:
      apim:
        condition: service_healthy
    # Scripts run through bash explicitly, so they work even if a file loses its execute bit
    command:
      - >-
        bash scripts/apim-bootstrap.sh dev &&
        if [ "$${RUN_GATEWAY_CHECK:-true}" = true ]; then
        GATEWAY_URL_OVERRIDE=$$GATEWAY_URL TOKEN_URL_OVERRIDE=$$APIM_URL/oauth2/token bash scripts/gateway-check.sh;
        fi
    restart: "no"
    networks: [jamii-net]

  # ---------- observability (stretch) ----------
  elasticsearch:
    profiles: [observability]
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    volumes: [es-data:/usr/share/elasticsearch/data]
    networks: [jamii-net]

  logstash:
    profiles: [observability]
    build: { context: ./docker/logstash }
    image: ${REGISTRY}/jamii/logstash:${TAG}
    environment: { LS_JAVA_OPTS: -Xms512m -Xmx512m }
    depends_on: [elasticsearch]
    networks: [jamii-net]

  filebeat:
    profiles: [observability]
    build: { context: ./docker/filebeat }
    image: ${REGISTRY}/jamii/filebeat:${TAG}
    volumes:
      - mi-logs:/logs/mi:ro
      - apim-logs:/logs/apim:ro
    depends_on: [logstash]
    networks: [jamii-net]

  kibana:
    profiles: [observability]
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    ports: ["127.0.0.1:5601:5601"]
    depends_on: [elasticsearch]
    networks: [jamii-net]

  # ---------- ci ----------
  registry:
    profiles: [ci]
    image: registry:2
    volumes: [registry-data:/var/lib/registry]
    ports: ["127.0.0.1:5000:5000"]
    networks: [jamii-net]

  jenkins:
    profiles: [ci]
    build: { context: ./docker/jenkins }
    image: ${REGISTRY}/jamii/jenkins:${TAG}
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dist:/dist:ro
    ports: ["127.0.0.1:8080:8080"]
    networks: [jamii-net]