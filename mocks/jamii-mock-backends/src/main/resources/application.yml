server:
  port: 8080
  # A real backend leaks its server identity; MI must strip this header.
  server-header: jamii-mock-backends/1.0

spring:
  application:
    name: jamii-mock-backends
  webservices:
    path: /ws
    servlet:
      init:
        transformWsdlLocations: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-system}] %-24logger{24} %msg%n"
  level:
    jamii.http: INFO
    ke.co.daqiqtech.jamii.mocks: INFO

mocks:
  logging:
    mask-pii: true          # mask customer PII and amounts in logged bodies
    max-body-chars: 2000    # truncate logged bodies beyond this length
  customer:
    slow-delay-ms: 7000     # > MI customer timeout (5 s)  -> 504
  credit:
    slow-delay-ms: 12000    # > MI SOAP timeout (10 s)     -> 504
